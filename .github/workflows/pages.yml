name: Deploy GitHub Pages (Static)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một deploy chạy tại một thời điểm; hủy run dồn hàng của commit cũ.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Staging static site content
        run: |
          mkdir -p _site
          # Chỉ đưa nội dung trang web công khai vào artifact.
          # Không publish .env, mã nguồn app (wildlife-mobile*, install script, ...).
          cp -r docs _site/docs
          cp -r html_tool _site/html_tool
          # Đánh dấu serve tĩnh, không qua Jekyll (giữ file HTML/MD nguyên bản như hiện tại).
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
